<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f7f9f8;
        --ink: #19211e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="38" data-track-index="0"></div>
      <div id="still-left" data-composition-id="still-left" data-composition-src="compositions/still-left.html" data-start="0" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="still-right" data-composition-id="still-right" data-composition-src="compositions/still-right.html" data-start="2" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="head" data-composition-id="head" data-composition-src="compositions/head.html" data-start="4" data-duration="9.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tree" data-composition-id="tree" data-composition-src="compositions/tree.html" data-start="13.5" data-duration="6.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="slots" data-composition-id="slots" data-composition-src="compositions/slots.html" data-start="20.3" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="compare" data-composition-id="compare" data-composition-src="compositions/compare.html" data-start="24.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="32" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
