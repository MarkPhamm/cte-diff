<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f7f9f8;
        --ink: #19211e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.3" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="38.3" data-track-index="0"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="marks" data-composition-id="marks" data-composition-src="compositions/marks.html" data-start="6.2" data-duration="5.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="preview" data-composition-id="preview" data-composition-src="compositions/preview.html" data-start="11.6" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="compare" data-composition-id="compare" data-composition-src="compositions/compare.html" data-start="17.2" data-duration="7.7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html" data-start="24.9" data-duration="7.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="32.3" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
