<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; font-family: "Geist", sans-serif; color: #19211e; }
    .ttl { position: absolute; left: 96px; top: 74px; z-index: 3; margin: 0; font-size: 64px; font-weight: 600; letter-spacing: -0.03em;
      line-height: 1.1; white-space: nowrap; }
    .w { display: inline-block; }
    .acc { color: #027567; }
    .stage { position: absolute; left: 0; top: 190px; width: 1920px; height: 890px; overflow: hidden; }
    .enter, .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    .vwin { position: absolute; left: 96px; top: 0; width: 1728px; height: 1038px; border-radius: 14px 14px 0 0; overflow: hidden;
      background: #fff; box-shadow: 0 0 0 1px rgba(25, 33, 30, 0.12), 0 12px 32px -16px rgba(25, 33, 30, 0.22); }
    .vwin video { position: absolute; left: 0; top: -42px; width: 1728px; height: 1080px; }
  </style>
  <div id="root" data-composition-id="files" data-width="1920" data-height="1080">
    <div class="stage" data-layout-allow-overflow>
      <div id="files-enter" class="enter">
        <div id="files-cam" class="cam">
          <div class="vwin">
            <video id="files-a" class="clip" src="assets/footage/files.mp4" data-start="0" data-duration="3.713" data-media-start="1.6" data-playback-rate="1.5" data-track-index="1" muted playsinline></video>
            <video id="files-b" class="clip" src="assets/footage/files.mp4" data-start="3.713" data-duration="0.653" data-media-start="7.17" data-playback-rate="3" data-track-index="2" muted playsinline></video>
            <video id="files-c" class="clip" src="assets/footage/files.mp4" data-start="4.366" data-duration="4.334" data-media-start="9.13" data-playback-rate="1" data-track-index="3" muted playsinline></video>
          </div>
        </div>
      </div>
    </div>
    <h1 id="files-t" class="clip ttl" data-start="1.6" data-duration="2.1" data-track-index="4"><span class="w">Two</span> <span class="w">files.</span> <span class="w">Two</span> <span class="w acc">logics.</span></h1>
    <h1 id="files-u" class="clip ttl" data-start="4.6" data-duration="1.7" data-track-index="5"><span class="w">Three</span> <span class="w">failed</span> <span class="w">payments.</span></h1>
    <h1 id="files-v" class="clip ttl" data-start="6.25" data-duration="2.45" data-track-index="6"><span class="w">Only</span> <span class="w">in</span> <span class="w">the</span> <span class="w acc">old</span> <span class="w">file.</span></h1>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const IN = { opacity: 0, filter: "blur(6px)" };
      const ON = { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" };
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.16, stagger: 0.03, ease: "power3.in" };
      const say = (id, a, b) => { tl.fromTo(id + " .w", IN, { ...ON }, a); tl.to(id + " .w", { ...OUT }, b); };
      /** A critically damped spring chases look-at keys [t, cx, cy, scale]; (cx, cy) is in the 1440×900 capture. */
      const camera = (sel, keys, end) => {
        const W = 7, H = 1 / 240, F = 1 / 30;
        const look = (t) => {
          let i = 0;
          while (i < keys.length - 1 && keys[i + 1][0] <= t) i++;
          const a = keys[i], b = keys[i + 1] || a;
          const u = b[0] > a[0] ? Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0]))) : 0;
          return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * u];
        };
        // The window fills the stage (1920×890) at every scale above 1.11; below that it is centred.
        const place = ([cx, cy, ls]) => {
          const s = Math.exp(ls), qx = 96 + 1.2 * cx, qy = 1.2 * cy - 42;
          const x = s * 1728 <= 1920 ? 960 * (1 - s) : Math.min(-s * 96, Math.max(1920 - s * 1824, 960 - s * qx));
          const y = Math.min(0, Math.max(890 - s * 1038, 445 - s * qy));
          return { x, y, scale: s };
        };
        let p = look(keys[0][0]), v = [0, 0, 0], t = 0;
        tl.set(sel, place(p), 0);
        for (let f = 1; f * F <= end + 1e-6; f++) {
          for (; t < f * F - 1e-9; t += H) {
            const g = look(t);
            for (let k = 0; k < 3; k++) { v[k] += (W * W * (g[k] - p[k]) - 2 * W * v[k]) * H; p[k] += v[k] * H; }
          }
          tl.to(sel, { ...place(p), duration: F, ease: "none" }, (f - 1) * F);
        }
      };
      // Footage time to scene time, read off the clips above.
      const clips = [...document.querySelectorAll("#files-cam video")].map((el) =>
        [+el.dataset.start, +el.dataset.mediaStart, +el.dataset.playbackRate, +el.dataset.duration]);
      const local = (m) => {
        for (const [s, ms, r, d] of clips) if (m <= ms + d * r + 1e-6) return s + Math.max(0, m - ms) / r;
        return 8.7;
      };
      // Keys in footage seconds. WIDE matches the git scene's last frame; PAIR shows both files; TABLE the comparison.
      const WIDE = [720, 450, 1], PAIR = [860, 300, 1.35], TABLE = [720, 520, 1.9];
      camera("#files-cam", [
        [1.6, ...WIDE], [2.3, ...WIDE], [2.65, 220, 190, 1.55], [3.4, 220, 190, 1.55],
        [3.8, ...PAIR], [5.9, ...PAIR], [6.6, 1076, 200, 1.6], [9.13, 1076, 200, 1.6], [9.25, ...TABLE],
      ].map(([m, ...k]) => [local(m), ...k]), 8.7);
      tl.fromTo("#files-enter", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 0);
      say("#files-t", 1.6, 3.5);
      say("#files-u", 4.6, 6.05);
      say("#files-v", 6.25, 8.35);
      tl.to("#files-enter", { x: -360, opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, 8.45);
      window.__timelines["files"] = tl;
    })();
  </script>
</template>
