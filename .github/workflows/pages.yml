# Builds the docs site (MkDocs Material, with the playground bundled from web/) on every pull request,
# and deploys it to GitHub Pages from main: https://markphamm.github.io/cte-diff/
name: Pages
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-docs.txt
      - run: mkdocs build --strict -d site
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Back-to-back merges otherwise race: Pages rejects a deploy while another is in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
