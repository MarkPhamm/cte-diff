# Publishes the extension to the VS Code Marketplace with Trusted Publishing (GitHub OIDC, no token).
# Needs a Trusted Publishing policy on the MarkPhamm publisher for this repo and this file name.
# Run it after scripts/release.sh: gh workflow run publish-vscode.yml
name: Publish VS Code extension

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned vsce (4.x has --oidc). `npx -y @vscode/vsce@<version>` would still run the local one.
      - run: npx vsce publish --oidc --no-dependencies
