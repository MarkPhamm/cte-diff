<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTE Diff user flow</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #fff; color: #111; font-family: Arial, Helvetica, sans-serif; }
  svg { display: block; width: 100%; max-width: 1730px; height: auto; margin: 0 auto; }
  text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #111; }
  .title { font-size: 20px; font-weight: bold; }
  .sub, .note, .flow-label, .gw-label, .legend text { font-size: 12px; }
  .sub, .flow-label { fill: #444; }
  .lane { fill: none; stroke: #222; stroke-width: 1.2; }
  .lane-head { fill: #f2f2f2; stroke: #222; stroke-width: 1.2; }
  .lane-name { font-weight: bold; }
  .task { fill: #fff; stroke: #222; stroke-width: 1.5; }
  .gw { fill: #fff; stroke: #222; stroke-width: 1.5; }
  .start { fill: #fff; stroke: #222; stroke-width: 1.5; }
  .end { fill: #fff; stroke: #222; stroke-width: 3.5; }
  .flow { fill: none; stroke: #222; stroke-width: 1.4; marker-end: url(#arrow); }
  .join { fill: none; stroke: #222; stroke-width: 1.4; }
  .bracket { fill: none; stroke: #555; stroke-width: 1.2; }
  .assoc { fill: none; stroke: #555; stroke-width: 1.2; stroke-dasharray: 2 3; }
  .c { text-anchor: middle; dominant-baseline: middle; }
</style>
</head>
<body>
<svg viewBox="0 0 1730 790" role="img" aria-labelledby="t d">
  <title id="t">CTE Diff user flow</title>
  <desc id="d">Swimlane flow: an analytics engineer opens two versions of a dbt model in a diff, CTE Diff marks the CTEs, the engineer previews or compares one CTE, dbt runs the query on the warehouse, the panel shows the result, and the engineer fixes the SQL or ships.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
  </defs>

  <text class="title" x="10" y="28">CTE Diff: user flow</text>
  <text class="sub" x="10" y="50">From a changed dbt model to a ship-or-fix decision, one CTE at a time. Notation: BPMN 2.0, simplified.</text>

  <g transform="translate(0,70)">
    <!-- Pool and lanes -->
    <rect class="lane" x="10" y="10" width="1710" height="610"/>
    <rect class="lane-head" x="10" y="10" width="40" height="260"/>
    <rect class="lane-head" x="10" y="270" width="40" height="220"/>
    <rect class="lane-head" x="10" y="490" width="40" height="130"/>
    <line class="lane" x1="50" y1="270" x2="1720" y2="270"/>
    <line class="lane" x1="50" y1="490" x2="1720" y2="490"/>
    <text class="lane-name c" transform="translate(30,140) rotate(-90)">Analytics engineer</text>
    <text class="lane-name c" transform="translate(30,380) rotate(-90)">CTE Diff (VS Code)</text>
    <text class="lane-name c" transform="translate(30,555) rotate(-90)">dbt + warehouse</text>

    <!-- Sequence flows -->
    <path class="flow" d="M116 160 H150"/>
    <path class="flow" d="M225 188 V382 H340"/>
    <path class="flow" d="M500 382 H610 V188"/>
    <path class="flow" d="M680 160 H720"/>
    <path class="flow" d="M800 160 H920 V300"/>
    <path class="flow" d="M760 194 V430 H840"/>
    <path class="flow" d="M1000 330 H1120 V525"/>
    <path class="flow" d="M1000 430 H1060 V525"/>
    <path class="flow" d="M1200 555 H1310 V412"/>
    <path class="flow" d="M1310 342 V188"/>
    <path class="flow" d="M1380 160 H1420"/>
    <path class="flow" d="M1500 160 H1540"/>
    <path class="flow" d="M1460 126 V60 H1170"/>
    <path class="flow" d="M1030 60 H610 V132"/>
    <path class="flow" d="M1620 160 H1664"/>
    <path class="join" d="M1580 126 V24 H610 V60"/>

    <text class="flow-label" x="810" y="150">Preview</text>
    <text class="flow-label" x="768" y="250">Compare</text>
    <text class="flow-label c" x="1520" y="148">Yes</text>
    <text class="flow-label" x="1468" y="100">No</text>
    <text class="flow-label c" x="1642" y="148">No</text>
    <text class="flow-label" x="1588" y="100">Yes</text>

    <!-- Analytics engineer -->
    <circle class="start" cx="100" cy="160" r="16"/>
    <text class="c" x="100" y="198">Model changed</text>

    <rect class="task" x="150" y="132" width="150" height="56" rx="8"/>
    <text class="c" x="225" y="152">Open the old and new</text>
    <text class="c" x="225" y="168">version in a diff</text>

    <rect class="task" x="540" y="132" width="140" height="56" rx="8"/>
    <text class="c" x="610" y="160">Pick a CTE</text>

    <polygon class="gw" points="760,126 800,160 760,194 720,160"/>
    <text class="gw-label c" x="760" y="102">Preview or</text>
    <text class="gw-label c" x="760" y="116">compare?</text>

    <rect class="task" x="1030" y="32" width="140" height="56" rx="8"/>
    <text class="c" x="1100" y="60">Fix the SQL</text>

    <rect class="task" x="1240" y="132" width="140" height="56" rx="8"/>
    <text class="c" x="1310" y="160">Read the result</text>

    <polygon class="gw" points="1460,126 1500,160 1460,194 1420,160"/>
    <text class="gw-label c" x="1460" y="212">As intended?</text>

    <polygon class="gw" points="1580,126 1620,160 1580,194 1540,160"/>
    <text class="gw-label c" x="1580" y="212">More CTEs</text>
    <text class="gw-label c" x="1580" y="226">to check?</text>

    <circle class="end" cx="1680" cy="160" r="16"/>
    <text class="c" x="1680" y="198">Ship it</text>

    <!-- CTE Diff -->
    <rect class="task" x="340" y="347" width="160" height="70" rx="8"/>
    <text class="c" x="420" y="366">Mark each CTE: changed,</text>
    <text class="c" x="420" y="382">new, removed, or reads</text>
    <text class="c" x="420" y="398">a changed CTE</text>

    <rect class="task" x="840" y="300" width="160" height="60" rx="8"/>
    <text class="c" x="920" y="314">Build a preview query:</text>
    <text class="c" x="920" y="330">the CTE and the CTEs</text>
    <text class="c" x="920" y="346">it reads, one side</text>

    <rect class="task" x="840" y="400" width="160" height="60" rx="8"/>
    <text class="c" x="920" y="422">Build a compare query:</text>
    <text class="c" x="920" y="438">both sides in one query</text>

    <rect class="task" x="1230" y="342" width="160" height="70" rx="8"/>
    <text class="c" x="1310" y="361">Show the result: rows,</text>
    <text class="c" x="1310" y="377">or the rows only one</text>
    <text class="c" x="1310" y="393">side returns, with counts</text>

    <path class="assoc" d="M1390 377 L1450 330"/>
    <path class="bracket" d="M1462 300 H1450 V360 H1462"/>
    <text class="note" x="1460" y="316">If dbt fails, the run is cancelled, or</text>
    <text class="note" x="1460" y="332">the warehouse can't compare, the</text>
    <text class="note" x="1460" y="348">panel says why instead.</text>

    <!-- dbt + warehouse -->
    <rect class="task" x="1040" y="525" width="160" height="60" rx="8"/>
    <text class="c" x="1120" y="547">Run dbt show --inline</text>
    <text class="c" x="1120" y="563">with your profile</text>

    <path class="assoc" d="M1200 578 L1420 568"/>
    <path class="bracket" d="M1432 535 H1420 V595 H1432"/>
    <text class="note" x="1430" y="552">One warehouse query per click.</text>
    <text class="note" x="1430" y="568">Rows go from your warehouse to</text>
    <text class="note" x="1430" y="584">VS Code. No telemetry.</text>
  </g>

  <!-- Legend -->
  <g class="legend" transform="translate(10,722)">
    <circle class="start" cx="12" cy="20" r="10"/><text x="30" y="24">Start</text>
    <rect class="task" x="90" y="8" width="44" height="24" rx="5"/><text x="144" y="24">Task</text>
    <polygon class="gw" points="214,6 230,20 214,34 198,20"/><text x="240" y="24">Decision</text>
    <circle class="end" cx="320" cy="20" r="10"/><text x="338" y="24">End</text>
    <path class="flow" d="M390 20 H440"/><text x="450" y="24">Sequence flow</text>
    <path class="bracket" d="M572 8 H562 V32 H572"/><text x="580" y="24">Note</text>
  </g>
</svg>
</body>
</html>
